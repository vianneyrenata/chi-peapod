# Named AI crawlers and SEO/scraping tools get a 403 on the app's data and API. This only stops
# bots that announce themselves (a scraper can claim to be Chrome), and it only works if CloudFront forwards the
# visitor's User-Agent to this origin, which is checked after each change with `curl -A GPTBot`.
map $http_user_agent $hfes_blocked_bot {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|Claude-SearchBot|Claude-User|Google-Extended|GoogleOther|CCBot|PerplexityBot|Perplexity-User|Bytespider|Amazonbot|Applebot-Extended|FacebookBot|meta-externalagent|meta-externalfetcher|cohere-ai|cohere-training-data-crawler|Diffbot|ImagesiftBot|Omgilibot|Omgili|Timpibot|YouBot|DuckAssistBot|MistralAI-User|AI2Bot|Ai2Bot-Dolma|PetalBot|SemrushBot|AhrefsBot|MJ12bot|DataForSeoBot|Scrapy|HTTrack) 1;
}

server {
    listen 80 default_server;
    server_name _;
    root /opt/hfes-match;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;
    include /etc/nginx/snippets/hfes-security-headers.conf;
    if ($hfes_blocked_bot) { return 403; }

    # The document root is the whole repo checkout. Only the app shell, the data files and images are
    # meant to be public — never the Python, deploy scripts, notes, dotfiles or the state dir
    # (2026-09-18 audit: server.py, embed_umap.py, CLAUDE.md and deploy.sh were all fetchable).
    location ~* \.(py|md|sh|txt|toml|lock|log|sqlite3|pdf|tgz|tar|gz|zip|bak)$ { return 404; }
    # Local-only backup folders: deploy.sh no longer uploads them, but 2026-09-28 found one on the server
    # (with a state tarball) publicly downloadable. ^~ wins over the csv/json/npy regexes below.
    location ^~ /ec2-backup-                          { return 404; }
    location ~ /\.                                    { return 404; }
    location ^~ /deploy/                              { return 404; }
    location ^~ /state/                               { return 404; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n\nUser-agent: GPTBot\nDisallow: /\n\nUser-agent: ChatGPT-User\nDisallow: /\n\nUser-agent: OAI-SearchBot\nDisallow: /\n\nUser-agent: ClaudeBot\nDisallow: /\n\nUser-agent: Claude-Web\nDisallow: /\n\nUser-agent: anthropic-ai\nDisallow: /\n\nUser-agent: Claude-SearchBot\nDisallow: /\n\nUser-agent: Claude-User\nDisallow: /\n\nUser-agent: Google-Extended\nDisallow: /\n\nUser-agent: GoogleOther\nDisallow: /\n\nUser-agent: CCBot\nDisallow: /\n\nUser-agent: PerplexityBot\nDisallow: /\n\nUser-agent: Perplexity-User\nDisallow: /\n\nUser-agent: Bytespider\nDisallow: /\n\nUser-agent: Amazonbot\nDisallow: /\n\nUser-agent: Applebot-Extended\nDisallow: /\n\nUser-agent: FacebookBot\nDisallow: /\n\nUser-agent: meta-externalagent\nDisallow: /\n\nUser-agent: meta-externalfetcher\nDisallow: /\n\nUser-agent: cohere-ai\nDisallow: /\n\nUser-agent: cohere-training-data-crawler\nDisallow: /\n\nUser-agent: Diffbot\nDisallow: /\n\nUser-agent: ImagesiftBot\nDisallow: /\n\nUser-agent: Omgilibot\nDisallow: /\n\n\n"; add_header Content-Type text/plain; include /etc/nginx/snippets/hfes-security-headers.conf; }

    # Feedback is anonymous: do not retain the requester address in Nginx logs.
    location = /api/feedback {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # The HTML app shell changes with every release. Never let a CDN or browser
    # keep an older copy while the static data and API have already updated.
    location = / {
        # try_files serves index.html while retaining this exact-location
        # context, so explicitly retain the shell's HTML MIME type.
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
        include /etc/nginx/snippets/hfes-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/hfes-security-headers.conf;
    }

    # nginx's mime.types has no entry for .csv, so it went out as application/octet-stream — a type
    # CloudFront never compresses, which put the 4 MB attendee CSV on the wire raw (the JSON next to
    # it, typed correctly, was compressed ~8x). Type it, and gzip at the origin too so direct-IP and
    # any CDN miss get the same ~4x saving.
    gzip on;
    gzip_types text/csv application/json text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    location ~* \.csv$ {
        # csv is not present in Ubuntu's stock mime.types. Keep this scoped to
        # CSVs: a server-level `types` block replaces the inherited MIME map,
        # which would otherwise turn index.html, JS, and CSS into downloads.
        default_type text/csv;
        add_header Cache-Control "public, max-age=3600";  # CHI: keep 1 h until umap_positions.json (23.8 MB) is trimmed; HFE runs 30 s
        include /etc/nginx/snippets/hfes-security-headers.conf;
    }

    location ~* \.(?:json|npy|joblib)$ {
        add_header Cache-Control "public, max-age=3600";  # CHI: keep 1 h until umap_positions.json (23.8 MB) is trimmed; HFE runs 30 s
        include /etc/nginx/snippets/hfes-security-headers.conf;
    }
}
