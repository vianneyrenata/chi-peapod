# Included in the server block AND in every location that sets its own add_header: nginx drops all
# inherited add_header lines the moment a location declares one, so without this include the four
# Cache-Control locations would silently lose these. HSTS is fine at the origin because CloudFront
# forwards origin response headers to the viewer. X-Robots-Tag keeps attendee bios out of search
# engines — the app is a one-week conference tool, not a public directory.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Robots-Tag "noindex, nofollow" always;
